name: C# Library Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version used for the NuGet package (may include a leading v)'
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration'
      project_path:
        required: true
        type: string
        description: 'Path to the .csproj (or the directory containing it)'
      publish_nuget:
        required: false
        type: boolean
        default: false
        description: 'Publish the .nupkg to nuget.org when NUGET_API_KEY is available'
      artifacts_path:
        required: false
        type: string
        default: 'release'
        description: 'Directory where the .nupkg and .dll are collected'
      filename:
        required: false
        type: string
        default: 'library'
        description: 'Artifact name used for the upload'

jobs:
  build:
    name: Build .NET package
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup .NET SDK ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Pack .NET library
        env:
          VERSION: ${{ inputs.version }}
          PROJECT_PATH: ${{ inputs.project_path }}
          CONFIGURATION: ${{ inputs.configuration }}
          ARTIFACTS: ${{ inputs.artifacts_path }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          CSPROJ="$PROJECT_PATH"

          if [[ -d "$CSPROJ" ]]; then
            CSPROJ=$(find "$CSPROJ" -maxdepth 1 -name '*.csproj' -print -quit)
          fi

          if [[ -z "$CSPROJ" || ! -f "$CSPROJ" ]]; then
            echo "Project not found: $PROJECT_PATH" >&2
            exit 1
          fi

          mkdir -p "$ARTIFACTS"
          dotnet pack "$CSPROJ" \
            -c "$CONFIGURATION" \
            -o "$ARTIFACTS" \
            -p:PackageVersion="$VERSION"

          NAME=$(basename "$CSPROJ" .csproj)
          DLL=$(find . -type f -path "*/bin/$CONFIGURATION/*/$NAME.dll" -not -path '*/obj/*' -print -quit)
          if [[ -n "$DLL" ]]; then
            cp "$DLL" "$ARTIFACTS/"
          else
            echo "Warning: $NAME.dll was not found; only the NuGet package will be released." >&2
          fi

      - name: Publish NuGet package
        if: inputs.publish_nuget
        env:
          ARTIFACTS: ${{ inputs.artifacts_path }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo 'NUGET_API_KEY is not configured; skipping NuGet publish.'
            exit 0
          fi

          shopt -s nullglob
          packages=( "$ARTIFACTS"/*.nupkg )
          if (( ${#packages[@]} == 0 )); then
            echo 'No .nupkg file was produced.' >&2
            exit 1
          fi

          dotnet nuget push "${packages[@]}" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.filename }}
          path: ${{ inputs.artifacts_path }}/*
