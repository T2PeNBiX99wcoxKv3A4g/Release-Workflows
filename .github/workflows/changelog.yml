name: Changelog

on:
  workflow_call:
    inputs:
      git_cliff_config_url:
        required: false
        type: string
        default: 'https://raw.githubusercontent.com/T2PeNBiX99wcoxKv3A4g/Git-Cliff-Template/refs/heads/master/cliff.toml'
        description: 'git-cliff configuration used to render the changelog'
      changelog_file:
        required: false
        type: string
        default: 'CHANGELOG.md'
        description: 'Changelog file that is regenerated and committed'
      commit_message:
        required: false
        type: string
        default: 'action: Update CHANGELOG.md'
        description: 'Commit message used for the changelog commit'
      ref:
        required: false
        type: string
        default: ''
        description: 'Branch the changelog is committed to (default: the ref of the caller)'
    outputs:
      changelog:
        description: 'Release body for the latest tag (latest section, header stripped)'
        value: ${{ jobs.changelog.outputs.changelog }}

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Update changelog
        id: changelog
        uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/actions/changelog@main
        with:
          config_url: ${{ inputs.git_cliff_config_url }}
          changelog_file: ${{ inputs.changelog_file }}
          stage_paths: ${{ inputs.changelog_file }}
          commit_message: ${{ inputs.commit_message }}
          push_ref: ${{ inputs.ref || github.ref_name }}
