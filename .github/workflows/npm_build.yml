name: npm Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version used for the npm package (may include a leading v)'
      node_version:
        required: false
        type: string
        default: '22'
        description: 'Node.js version'
      npm_directory:
        required: true
        type: string
        description: 'Directory of the npm package'
      npm_pack_command:
        required: false
        type: string
        default: 'npm run pack'
        description: 'Command that builds and packs the npm package'
      publish_npm:
        required: false
        type: boolean
        default: false
        description: 'Publish to npmjs.org when NPM_TOKEN is available'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Publish under the npm next tag'
      artifacts_path:
        required: false
        type: string
        default: 'release'
        description: 'Directory where the tarball is collected'
      filename:
        required: false
        type: string
        default: 'npm-package'
        description: 'Artifact name used for the upload'

jobs:
  build:
    name: Build npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Pack npm package
        env:
          VERSION: ${{ inputs.version }}
          NPM_DIRECTORY: ${{ inputs.npm_directory }}
          NPM_PACK_COMMAND: ${{ inputs.npm_pack_command }}
          ARTIFACTS: ${{ inputs.artifacts_path }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"

          cd "$NPM_DIRECTORY"
          npm install --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          bash -c "$NPM_PACK_COMMAND"

          mkdir -p "$GITHUB_WORKSPACE/$ARTIFACTS"
          shopt -s nullglob
          tarballs=( ./*.tgz )
          if (( ${#tarballs[@]} == 0 )); then
            echo 'No npm tarball was produced.' >&2
            exit 1
          fi

          mv "${tarballs[@]}" "$GITHUB_WORKSPACE/$ARTIFACTS/"

      - name: Publish npm package
        if: inputs.publish_npm
        env:
          NPM_DIRECTORY: ${{ inputs.npm_directory }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'NPM_TOKEN is not configured; skipping npm publish.'
            exit 0
          fi

          cd "$NPM_DIRECTORY"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

          if [ "$PRERELEASE" = 'true' ]; then TAG='next'; else TAG='latest'; fi
          npm publish --access public --tag "$TAG"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.filename }}
          path: ${{ inputs.artifacts_path }}/*
