name: JVM Rebuild Pages

on:
  workflow_call:
    inputs:
      maven_branch:
        required: false
        type: string
        default: maven
        description: 'Branch name for the maven repository'
      maven_template_url:
        required: false
        type: string
        default: 'https://github.com/T2PeNBiX99wcoxKv3A4g/Maven-Template/archive/refs/heads/master.tar.gz'
        description: 'Template tar.gz URL to initialize maven branch if missing'

jobs:
  setup_maven:
    name: Setup Maven Repository
    uses: ./.github/workflows/setup_maven_pages.yml
    with:
      maven_branch: ${{ inputs.maven_branch }}
      maven_template_url: ${{ inputs.maven_template_url }}
    secrets: inherit

  rebuild_pages:
    name: Rebuild Maven Pages
    needs: [ setup_maven ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set git user
        uses: fregante/setup-git-user@v2

      - name: Checkout to Maven repository
        shell: bash
        run: |
          git fetch origin
          git reset --hard
          git clean -fdx
          git fetch origin ${{ inputs.maven_branch }}:${{ inputs.maven_branch }} || true
          git checkout ${{ inputs.maven_branch }}

      - name: Setup Python
        uses: astral-sh/setup-uv@v10.1.0

      - name: Generate html
        run: |
          uv run main.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
