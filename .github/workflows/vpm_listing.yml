name: VPM Listing

on:
  workflow_call:
    inputs:
      publish_directory:
        required: false
        type: string
        default: 'Website'
        description: 'Directory the listing is generated into; it is uploaded to Pages'
      site_repository:
        required: false
        type: string
        default: 'T2PeNBiX99wcoxKv3A4g/VPM-WebSite'
        description: 'Repository that holds the listing frontend'
      site_ref:
        required: false
        type: string
        default: 'main'
        description: 'Ref of the listing frontend repository'
      site_directory:
        required: false
        type: string
        default: '.listing-site'
        description: 'Directory the listing frontend is checked out into'
      node_version:
        required: false
        type: string
        default: '22'
        description: 'Node.js version used to build the listing frontend'
      ci_directory:
        required: false
        type: string
        default: 'ci'
        description: 'Directory the package-list-action repository is checked out into'
      ci_repository:
        required: false
        type: string
        default: 'vrchat-community/package-list-action'
        description: 'Repository that provides the listing build'
      current_package_name:
        required: false
        type: string
        default: ''
        description: 'Id of the package this repository publishes, usually the folder name under Packages/. Leave it empty for a repository that only aggregates other repositories'

jobs:
  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      # The site lives in one place now; every repository builds the same app and
      # lets the listing action inject its own package data.
      - name: Check-out listing frontend
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.site_repository }}
          ref: ${{ inputs.site_ref }}
          path: ${{ inputs.site_directory }}

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build listing frontend
        working-directory: ${{ inputs.site_directory }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      # `dist/app.js` is the Scriban template: the listing action renders it and
      # index.json/index.html into this directory.
      - name: Publish the built site
        env:
          SITE_DIRECTORY: ${{ inputs.site_directory }}
          PUBLISH_DIRECTORY: ${{ inputs.publish_directory }}
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISH_DIRECTORY"
          cp -R "$SITE_DIRECTORY/dist/." "$PUBLISH_DIRECTORY/"

      # Check out the automation repository without removing prior checkouts
      - name: Check-out automation repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.ci_repository }}
          path: ${{ inputs.ci_directory }}
          clean: false

      - name: Build package version listing
        env:
          CI_DIRECTORY: ${{ inputs.ci_directory }}
          PUBLISH_DIRECTORY: ${{ inputs.publish_directory }}
          PACKAGE_NAME: ${{ inputs.current_package_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          args=(
            --root "$CI_DIRECTORY"
            --list-publish-directory "$GITHUB_WORKSPACE/$PUBLISH_DIRECTORY"
          )

          if [ -n "$PACKAGE_NAME" ]; then
            args+=(--current-package-name "$PACKAGE_NAME")
          fi

          "./$CI_DIRECTORY/build.cmd" BuildRepoListing "${args[@]}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/actions/pages-deploy@main
        with:
          path: ${{ inputs.publish_directory }}
