name: Web Pages

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: '.'
        description: 'Directory that holds the site'
      node_version:
        required: false
        type: string
        default: '22'
        description: 'Node.js version used to build the site'
      install_command:
        required: false
        type: string
        default: 'npm ci --no-audit --no-fund'
        description: 'Command that installs the dependencies'
      build_command:
        required: false
        type: string
        default: 'npm run build'
        description: 'Command that builds the site'
      cache_dependency_path:
        required: false
        type: string
        default: 'package-lock.json'
        description: >-
          Lockfile used for the dependency cache, relative to the working directory. Leave it empty to disable the
          cache.
      fetch_depth:
        required: false
        type: number
        default: 1
        description: 'Checkout history depth; 0 fetches everything for sites that read commit dates'
      publish_directory:
        required: false
        type: string
        default: 'dist'
        description: 'Directory the build writes, relative to the working directory; it is deployed to Pages'
      enable_pages:
        required: false
        type: boolean
        default: true
        description: 'Turn GitHub Pages on (source: GitHub Actions) when it is still off'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.cache_dependency_path != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.working_directory }}/${{ inputs.cache_dependency_path }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_COMMAND"

      - name: Build site
        working-directory: ${{ inputs.working_directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_COMMAND"

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: web-pages-site
          path: ${{ inputs.working_directory }}/${{ inputs.publish_directory }}
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy site
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pages_deploy.yml
    with:
      artifact_name: web-pages-site
      enable_pages: ${{ inputs.enable_pages }}
