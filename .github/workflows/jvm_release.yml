name: JVM Release

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        type: string
        default: '25'
      java_distribution:
        required: false
        type: string
        default: 'microsoft'
      version_keyword:
        required: false
        type: string
        default: version
      set_version_max_matches:
        required: false
        type: number
        default: 1
        description: 'How many matching lines set-version may rewrite (1 = only the authoritative version; -1 = every match)'
      version_file_path:
        required: false
        type: string
        default: ./gradle.properties
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key.
      update_readme:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      publish_maven:
        required: false
        type: boolean
        default: false
      maven_branch:
        required: false
        type: string
        default: maven
        description: 'Branch name for the maven repository'
      maven_template_url:
        required: false
        type: string
        default: 'https://github.com/T2PeNBiX99wcoxKv3A4g/Maven-Template/archive/refs/heads/master.tar.gz'
        description: 'Template tar.gz URL to initialize maven branch if missing'
      artifacts_path:
        required: false
        type: string
        default: 'build/libs/'
        description: 'Path for built jar artifacts'
      maven_repo_path:
        required: false
        type: string
        default: 'build/repo/'
        description: 'Path for local maven repository'

jobs:
  version-change:
    name: Version Change
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      set_version_max_matches: ${{ inputs.set_version_max_matches }}
      extra_version_files: ${{ inputs.extra_version_files }}
      update_readme: ${{ inputs.update_readme }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: "action: Update version in `gradle.properties` and update `CHANGELOG.md`"
    secrets: inherit

  build:
    name: Build
    needs: [ version-change ]
    uses: ./.github/workflows/jvm_build.yml
    with:
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      publish_maven: ${{ inputs.publish_maven }}
      artifacts_path: ${{ inputs.artifacts_path }}
      maven_repo_path: ${{ inputs.maven_repo_path }}
    secrets: inherit

  publish-maven-pages:
    name: Publish Maven & Pages
    if: inputs.publish_maven == true
    needs: [ version-change, build ]
    uses: ./.github/workflows/jvm_publish_maven_pages.yml
    with:
      tag: ${{ needs.version-change.outputs.new_tag }}
      maven_branch: ${{ inputs.maven_branch }}
      maven_template_url: ${{ inputs.maven_template_url }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, build ]
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs.version-change.outputs.new_tag }}
      changelog: ${{ needs.version-change.outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: "release/*.jar"
    secrets: inherit
