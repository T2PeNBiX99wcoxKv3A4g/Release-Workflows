name: npm Release

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: '22'
        description: 'Node.js version'
      npm_directory:
        required: true
        type: string
        description: 'Directory of the npm package'
      npm_pack_command:
        required: false
        type: string
        default: 'npm run pack'
        description: 'Command that builds and packs the npm package'
      publish_npm:
        required: false
        type: boolean
        default: false
        description: 'Publish to npmjs.org when NPM_TOKEN is available'
      version_file_path:
        required: true
        type: string
        description: 'File that holds the package version (e.g. package.json)'
      version_keyword:
        required: false
        type: string
        default: version
        description: 'Version key in version_file_path'
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key.
      filename:
        required: false
        type: string
        default: 'npm-package'
        description: 'Artifact name and release file prefix'
      artifacts_path:
        required: false
        type: string
        default: 'release'
        description: 'Directory where the tarball is collected'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this is a pre-release'
      commit_message:
        required: false
        type: string
        default: 'action: Update version and update `CHANGELOG.md`'
        description: 'Commit message for the version bump'

jobs:
  version-change:
    name: Version Change
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      extra_version_files: ${{ inputs.extra_version_files }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: ${{ inputs.commit_message }}
    secrets: inherit

  build:
    name: Build npm package
    needs: [ version-change ]
    uses: ./.github/workflows/npm_build.yml
    with:
      version: ${{ needs['version-change'].outputs.new_version }}
      node_version: ${{ inputs.node_version }}
      npm_directory: ${{ inputs.npm_directory }}
      npm_pack_command: ${{ inputs.npm_pack_command }}
      publish_npm: ${{ inputs.publish_npm }}
      prerelease: ${{ inputs.prerelease }}
      artifacts_path: ${{ inputs.artifacts_path }}
      filename: ${{ inputs.filename }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, build ]
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs['version-change'].outputs.new_tag }}
      changelog: ${{ needs['version-change'].outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: ${{ inputs.artifacts_path }}/*
      artifacts_path: ${{ inputs.artifacts_path }}
    secrets: inherit
