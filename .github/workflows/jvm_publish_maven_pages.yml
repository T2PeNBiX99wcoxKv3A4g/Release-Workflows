name: JVM Publish Maven & Pages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Release tag being published'
      publish_maven:
        required: false
        type: boolean
        default: true
        description: 'Whether to download and publish maven-repository artifact'
      publish_pages:
        required: false
        type: boolean
        default: true
        description: 'Whether to deploy documentation to GitHub Pages'
      maven_branch:
        required: false
        type: string
        default: maven
        description: 'Branch name for the maven repository'
      maven_template_url:
        required: false
        type: string
        default: 'https://github.com/T2PeNBiX99wcoxKv3A4g/Maven-Template/archive/refs/heads/master.tar.gz'
        description: 'Template tar.gz URL to initialize maven branch if missing'

jobs:
  setup_maven:
    name: Setup Maven Repository
    uses: ./.github/workflows/setup_maven_pages.yml
    with:
      maven_branch: ${{ inputs.maven_branch }}
      maven_template_url: ${{ inputs.maven_template_url }}
    secrets: inherit

  publish_maven:
    name: Publish Maven & Pages
    needs: [ setup_maven ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set git user
        uses: fregante/setup-git-user@v2

      - name: Checkout to Maven repository
        shell: bash
        run: |
          git fetch origin
          git reset --hard
          git clean -fdx
          git fetch origin ${{ inputs.maven_branch }}:${{ inputs.maven_branch }} || true
          git checkout ${{ inputs.maven_branch }}

      - name: Download Maven Repository
        if: inputs.publish_maven == true
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: .maven-repository

      - name: Publish Maven repository
        if: inputs.publish_maven == true
        shell: bash
        run: |
          cp -R .maven-repository/. .
          rm -rf .maven-repository

          git add .
          git commit -m "action: Publish ${{ inputs.tag != '' && inputs.tag || 'artifacts' }}" || exit 0
          git push origin ${{ inputs.maven_branch }}

      - name: Setup Python
        if: inputs.publish_pages == true
        uses: astral-sh/setup-uv@v5

      - name: Generate html
        if: inputs.publish_pages == true
        run: |
          uv run main.py

      - name: Commit and push page changes if any
        if: inputs.publish_pages == true && inputs.publish_maven == false
        shell: bash
        run: |
          git add .
          git commit -m "action: Rebuild Maven pages" || echo "No changes to commit"
          git push origin ${{ inputs.maven_branch }} || true

      - name: Setup Pages
        if: inputs.publish_pages == true
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: inputs.publish_pages == true
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: inputs.publish_pages == true
        id: deployment
        uses: actions/deploy-pages@v5
