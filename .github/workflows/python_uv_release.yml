name: Python UV Release

on:
  workflow_call:
    inputs:
      filename:
        required: true
        type: string
        description: 'Output artifact filename prefix'
      version_keyword:
        required: false
        type: string
        default: version
        description: 'Keyword for version in project configuration'
      version_file_path:
        required: false
        type: string
        default: ./pyproject.toml
        description: 'File path containing project version'
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key.
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this release is a pre-release'

jobs:
  version-change:
    name: Version Change
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      extra_version_files: ${{ inputs.extra_version_files }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: "action: Update version in `pyproject.toml` and update `CHANGELOG.md`"
    secrets: inherit

  windows-release-build:
    name: Windows Latest Build
    needs: [ version-change ]
    uses: ./.github/workflows/python_uv_build_windows.yml
    with:
      filename: ${{ inputs.filename }}
    secrets: inherit

  linux-release-build:
    name: Linux Latest Build
    needs: [ version-change ]
    uses: ./.github/workflows/python_uv_build_linux.yml
    with:
      filename: ${{ inputs.filename }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, windows-release-build, linux-release-build ]
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs.version-change.outputs.new_tag }}
      changelog: ${{ needs.version-change.outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: "release/*"
    secrets: inherit
