name: Python UV Release

on:
  workflow_call:
    inputs:
      filename:
        required: true
        type: string
        description: 'Output artifact filename prefix'
      version_keyword:
        required: false
        type: string
        default: version
        description: 'Keyword for version in project configuration'
      set_version_max_matches:
        required: false
        type: number
        default: 1
        description: 'How many matching lines set-version may rewrite (1 = only the authoritative version; -1 = every match)'
      version_file_path:
        required: false
        type: string
        default: ./pyproject.toml
        description: 'File path containing project version'
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key.
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this release is a pre-release'

jobs:
  version-change:
    name: Version Change
    permissions:
      contents: write
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      set_version_max_matches: ${{ inputs.set_version_max_matches }}
      extra_version_files: ${{ inputs.extra_version_files }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: "action: Update version in `pyproject.toml` and update `CHANGELOG.md`"
    secrets: inherit

  build:
    name: Build
    needs: [ version-change ]
    uses: ./.github/workflows/python_uv_build.yml
    with:
      filename: ${{ inputs.filename }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, build ]
    permissions:
      contents: write
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs.version-change.outputs.new_tag }}
      changelog: ${{ needs.version-change.outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: "release/*"
    secrets: inherit
