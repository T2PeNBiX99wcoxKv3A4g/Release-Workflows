name: Version Change

on:
  workflow_call:
    inputs:
      version_file_path:
        required: true
        type: string
      version_keyword:
        required: false
        type: string
        default: version
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key (e.g. UserInterface/package.json|version).
      update_readme:
        required: false
        type: boolean
        default: false
      readme_file_path:
        required: false
        type: string
        default: ./README.md
      require_keywords:
        required: false
        type: string
        default: ''
        description: 'Comma separated keywords the target version line must also contain (set-version)'
      replace_version_key:
        required: false
        type: string
        default: ''
        description: 'Version key that limits sync-version to matching lines (empty replaces every occurrence)'
      set_version_max_matches:
        required: false
        type: number
        default: 1
        description: 'How many matching lines set-version may rewrite (1 = only the authoritative version; -1 = every match)'
      debug:
        required: false
        type: boolean
        default: false
        description: 'Enable icecream debug output for the version scripts'
      prerelease:
        required: false
        type: boolean
        default: false
      tag_prefix:
        required: false
        type: string
        default: 'v'
        description: 'Prefix the tag action expects on existing tags. Tags without it are ignored, which restarts numbering at 0.0.0'
      commit_message:
        required: false
        type: string
        default: 'action: Update version and CHANGELOG.md'
      git_cliff_config_url:
        required: false
        type: string
        default: 'https://raw.githubusercontent.com/T2PeNBiX99wcoxKv3A4g/Git-Cliff-Template/refs/heads/master/cliff.toml'
      python_scripts_repo:
        required: false
        type: string
        default: 'https://github.com/T2PeNBiX99wcoxKv3A4g/Version-Change-Workflow-Scripts.git'
    outputs:
      new_tag:
        description: 'The newly created tag'
        value: ${{ jobs.version_change.outputs.new_tag }}
      new_version:
        description: 'The newly bumped version'
        value: ${{ jobs.version_change.outputs.new_version }}
      changelog:
        description: 'The generated release changelog'
        value: ${{ jobs.version_change.outputs.changelog }}
      previous_tag:
        description: 'The previous tag before bump'
        value: ${{ jobs.version_change.outputs.previous_tag }}
      release_type:
        description: 'The release type'
        value: ${{ jobs.version_change.outputs.release_type }}

jobs:
  version_change:
    name: Version Change
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.change_version.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.content }}
      previous_tag: ${{ steps.tag_version.outputs.previous_tag }}
      release_type: ${{ steps.tag_version.outputs.release_type }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull changes
        run: git pull

      - name: Bump version and push tag (Normal Release)
        if: inputs.prerelease == false
        id: normal_release_tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pre_release_branches: "dev"
          tag_prefix: ${{ inputs.tag_prefix }}

      - name: Bump version and push tag (Pre Release)
        if: inputs.prerelease == true
        id: pre_release_tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pre_release_branches: "dev"
          tag_prefix: ${{ inputs.tag_prefix }}
          custom_release_rules: "fix:prerelease,feat:prerelease"

      - name: Set unified tag version outputs
        id: tag_version
        run: |
          NEW_TAG="${{ steps.normal_release_tag_version.outputs.new_tag || steps.pre_release_tag_version.outputs.new_tag }}"
          NEW_VERSION="${{ steps.normal_release_tag_version.outputs.new_version || steps.pre_release_tag_version.outputs.new_version }}"
          PREVIOUS_TAG="${{ steps.normal_release_tag_version.outputs.previous_tag || steps.pre_release_tag_version.outputs.previous_tag }}"
          RELEASE_TYPE="${{ steps.normal_release_tag_version.outputs.release_type || steps.pre_release_tag_version.outputs.release_type }}"

          # A retry with no new commits since the last tag produces no new tag.
          # Reuse the latest existing tag instead of failing the release.
          if [ -z "$NEW_TAG" ]; then
            git fetch --tags >/dev/null 2>&1 || true
            NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git tag --sort=-v:refname | head -n 1 || true)

            if [ -n "$NEW_TAG" ]; then
              echo "No new tag was generated; reusing existing tag $NEW_TAG"
            fi
          fi

          if [ -z "$NEW_VERSION" ] && [ -n "$NEW_TAG" ]; then
            NEW_VERSION="${NEW_TAG#v}"
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"

          if [ -z "$TAG" ]; then
            echo "No tag generated!"
            exit 1
          fi

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            echo "Tag $TAG does not exist, creating..."

            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Verify tag exists
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.tag_version.outputs.new_tag }}" >/dev/null 2>&1; then
            echo "Tag exists"
          else
            echo "Tag missing!"
            exit 1
          fi

      - name: Clone `Version-Change-Workflow-Scripts` Python script
        run: git clone ${{ inputs.python_scripts_repo }} .scripts

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '>=3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r .scripts/requirements.txt

      - name: Change version in target file
        id: change_version
        env:
          VERSION_FILE_PATH: ${{ inputs.version_file_path }}
          VERSION_KEYWORD: ${{ inputs.version_keyword }}
          NEW_VERSION: ${{ steps.tag_version.outputs.new_tag }}
          REQUIRE_KEYWORDS: ${{ inputs.require_keywords }}
          SET_VERSION_MAX_MATCHES: ${{ inputs.set_version_max_matches }}
          DEBUG: ${{ inputs.debug }}
        run: |
          args=()
          if [ -n "$REQUIRE_KEYWORDS" ]; then
            args+=(--require-keywords "$REQUIRE_KEYWORDS")
          fi
          args+=(--max-matches "$SET_VERSION_MAX_MATCHES")
          if [ "$DEBUG" = "true" ]; then
            args+=(--debug)
          fi
          python .scripts/change_version.py set-version "$VERSION_FILE_PATH" "$VERSION_KEYWORD" "$NEW_VERSION" "${args[@]}"

      - name: Change version in README
        if: inputs.update_readme == true
        env:
          README_FILE_PATH: ${{ inputs.readme_file_path }}
          REPLACE_VERSION_KEY: ${{ inputs.replace_version_key }}
          DEBUG: ${{ inputs.debug }}
        run: |
          args=()
          if [ -n "$REPLACE_VERSION_KEY" ]; then
            args+=(--version-key "$REPLACE_VERSION_KEY")
          fi
          if [ "$DEBUG" = "true" ]; then
            args+=(--debug)
          fi
          python .scripts/change_version.py sync-version "$README_FILE_PATH" "${args[@]}"

      - name: Change version in extra files
        if: inputs.extra_version_files != ''
        env:
          EXTRA_VERSION_FILES: ${{ inputs.extra_version_files }}
          DEBUG: ${{ inputs.debug }}
        run: |
          args=()
          if [ "$DEBUG" = "true" ]; then
            args+=(--debug)
          fi

          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            [ -z "$entry" ] && continue

            file="${entry%%|*}"
            key=""
            key_args=()
            if [[ "$entry" == *"|"* ]]; then
              key="${entry#*|}"
              key_args+=(--version-key "$key")
            fi

            python .scripts/change_version.py sync-version \
              "$file" "${key_args[@]}" "${args[@]}"
          done <<< "$EXTRA_VERSION_FILES"

      - name: Remove `.scripts`
        run: rm -rf .scripts

      # The changelog + commit + push half is shared with the standalone
      # `changelog.yml` workflow. `.` stages the bumped version files together
      # with CHANGELOG.md so the bump stays a single commit.
      - name: Update changelog and push
        id: changelog
        uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/actions/changelog@main
        with:
          config_url: ${{ inputs.git_cliff_config_url }}
          changelog_file: 'CHANGELOG.md'
          stage_paths: '.'
          commit_message: ${{ inputs.commit_message }}
          push_ref: ${{ github.ref_name }}
