name: C# Build

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration (e.g. Release / Debug)'
      runtimes:
        required: false
        type: string
        default: '["win-x64", "linux-x64"]'
        description: 'JSON array of .NET Runtime Identifiers (RID) to publish for'
      publish_path:
        required: false
        type: string
        default: 'publish/'
        description: 'Base path for published output (runtime subfolder appended)'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull changes
        run: git pull

      - name: Setup .NET SDK ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Publish for ${{ matrix.runtime }}
        run: dotnet publish -r ${{ matrix.runtime }} -c ${{ inputs.configuration }} -o ${{ inputs.publish_path }}${{ matrix.runtime }}/

      - name: Upload Published Output for ${{ matrix.runtime }}
        uses: actions/upload-artifact@v7
        with:
          name: PublishedOutput-${{ matrix.runtime }}
          path: ${{ inputs.publish_path }}${{ matrix.runtime }}/
