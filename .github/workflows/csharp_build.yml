name: C# Build

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration (e.g. Release / Debug)'
      project_path:
        required: false
        type: string
        default: '.'
        description: 'Path to the .csproj (or a directory containing it). Must not be a .sln: --output is unsupported for solutions.'
      runtimes:
        required: false
        type: string
        default: '["win-x64", "linux-x64"]'
        description: 'JSON array of .NET Runtime Identifiers (RID) to publish for'
      filename:
        required: false
        type: string
        default: 'release'
        description: 'Output archive filename prefix'
      publish_path:
        required: false
        type: string
        default: 'publish/'
        description: 'Base path for published output (runtime subfolder appended)'

jobs:
  build:
    name: Build
    runs-on: ${{ (startsWith(matrix.runtime, 'win') && 'windows-latest') || (startsWith(matrix.runtime, 'linux') && 'ubuntu-latest') || (startsWith(matrix.runtime, 'osx') && 'macos-latest') || 'ubuntu-latest' }}
    strategy:
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull changes
        run: git pull

      - name: Setup .NET SDK ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Ensure AOT toolchain (Linux)
        if: startsWith(matrix.runtime, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish for ${{ matrix.runtime }}
        run: dotnet publish ${{ inputs.project_path }} -r ${{ matrix.runtime }} -c ${{ inputs.configuration }} -o ${{ inputs.publish_path }}${{ matrix.runtime }}/

      - name: Create Archive for ${{ matrix.runtime }}
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: '${{ inputs.filename }}-${{ matrix.runtime }}.zip'
          directory: ${{ inputs.publish_path }}${{ matrix.runtime }}/
          exclusions: '${{ inputs.filename }}-${{ matrix.runtime }}.zip'

      - name: Upload Published Output for ${{ matrix.runtime }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.filename }}-${{ matrix.runtime }}
          path: ${{ inputs.publish_path }}${{ matrix.runtime }}/${{ inputs.filename }}-${{ matrix.runtime }}.zip
