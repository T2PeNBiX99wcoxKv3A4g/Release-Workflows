name: C# Build

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration (e.g. Release / Debug)'
      project_path:
        required: false
        type: string
        default: '.'
        description: 'Path to the .csproj (or a directory containing it). Must not be a .sln: --output is unsupported for solutions.'
      runtimes:
        required: false
        type: string
        default: '["win-x64", "linux-x64"]'
        description: 'JSON array of .NET Runtime Identifiers (RID) to publish for'
      setup_aot_toolchain:
        required: false
        type: boolean
        default: false
        description: 'Install the Native AOT build dependencies of the target OS before publishing. Only needed when the project sets PublishAot=true'
      filename:
        required: false
        type: string
        default: 'release'
        description: 'Output archive filename prefix'
      publish_path:
        required: false
        type: string
        default: 'publish/'
        description: 'Base path for published output (runtime subfolder appended)'
      msi_script:
        required: false
        type: string
        default: ''
        description: 'Script run on Windows after publishing to build an installer. Reads VERSION, PUBLISH_DIR, OUTPUT_DIR and RUNTIME from the environment; an empty value builds no MSI'
      rpm_script:
        required: false
        type: string
        default: ''
        description: 'Script run on Linux inside a Fedora container after publishing to build an RPM. Reads VERSION, PUBLISH_DIR, OUTPUT_DIR and RUNTIME from the environment; an empty value builds no RPM'

jobs:
  build:
    name: Build
    runs-on: ${{ (startsWith(matrix.runtime, 'win') && 'windows-latest') || (startsWith(matrix.runtime, 'linux') && 'ubuntu-latest') || (startsWith(matrix.runtime, 'osx') && 'macos-latest') || 'ubuntu-latest' }}
    strategy:
      matrix:
        runtime: ${{ fromJSON(inputs.runtimes) }}
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull changes
        run: git pull

      - name: Setup .NET SDK ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Ensure AOT toolchain (Linux)
        if: inputs.setup_aot_toolchain && startsWith(matrix.runtime, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish for ${{ matrix.runtime }}
        run: dotnet publish ${{ inputs.project_path }} -r ${{ matrix.runtime }} -c ${{ inputs.configuration }} -o ${{ inputs.publish_path }}${{ matrix.runtime }}/

      - name: Read project version
        if: inputs.msi_script != '' || inputs.rpm_script != ''
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild "${{ inputs.project_path }}" -getProperty:Version).Trim()
          if (-not $version) { throw "Could not read <Version> from ${{ inputs.project_path }}" }
          Write-Host "Project version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create Archive for ${{ matrix.runtime }}
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: '${{ inputs.filename }}-${{ matrix.runtime }}.zip'
          directory: ${{ inputs.publish_path }}${{ matrix.runtime }}/
          exclusions: '${{ inputs.filename }}-${{ matrix.runtime }}.zip'

      - name: Build MSI for ${{ matrix.runtime }}
        if: inputs.msi_script != '' && startsWith(matrix.runtime, 'win')
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_DIR: ${{ inputs.publish_path }}${{ matrix.runtime }}
          OUTPUT_DIR: ${{ inputs.publish_path }}${{ matrix.runtime }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          & "./${{ inputs.msi_script }}"
          if ($LASTEXITCODE -ne 0) { throw "The MSI script failed" }

      - name: Build RPM for ${{ matrix.runtime }}
        if: inputs.rpm_script != '' && startsWith(matrix.runtime, 'linux')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_DIR: ${{ inputs.publish_path }}${{ matrix.runtime }}
          OUTPUT_DIR: ${{ inputs.publish_path }}${{ matrix.runtime }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          chmod +x "${{ inputs.rpm_script }}"
          # The runner has Docker but no rpmbuild; Fedora provides both a current toolchain and the
          # distribution suffix (%{?dist}) Fedora users expect.
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e VERSION -e PUBLISH_DIR -e OUTPUT_DIR -e RUNTIME \
            fedora:latest \
            bash -c "dnf -y install rpm-build tar gzip >/dev/null && ${{ inputs.rpm_script }}"

      - name: Upload Published Output for ${{ matrix.runtime }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.filename }}-${{ matrix.runtime }}
          path: |
            ${{ inputs.publish_path }}${{ matrix.runtime }}/${{ inputs.filename }}-${{ matrix.runtime }}.zip
            ${{ inputs.publish_path }}${{ matrix.runtime }}/*.msi
            ${{ inputs.publish_path }}${{ matrix.runtime }}/*.rpm
