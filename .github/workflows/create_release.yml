name: Create Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Git tag for the release'
      changelog:
        required: false
        type: string
        default: ''
        description: 'Changelog or release notes body'
      artifacts:
        required: false
        type: string
        default: 'release/*'
        description: 'Artifact path pattern for the release'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this release is a pre-release'
      release_name:
        required: false
        type: string
        default: ''
        description: 'Custom release name (default: Release/Pre Release <ref_name> <tag>)'
      download_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Whether to download build artifacts before creating the release'
      artifacts_path:
        required: false
        type: string
        default: 'release'
        description: 'Path where artifacts are downloaded'

jobs:
  upload:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        if: inputs.download_artifacts == true
        uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.artifacts_path }}
          merge-multiple: true

      - name: Create Release (Normal Release)
        if: inputs.prerelease == false
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ inputs.artifacts }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0} {1}', github.ref_name, inputs.tag) }}
          body: ${{ inputs.changelog }}

      - name: Create Release (Pre Release)
        if: inputs.prerelease == true
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ inputs.artifacts }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Pre Release {0} {1}', github.ref_name, inputs.tag) }}
          body: ${{ inputs.changelog }}
          prerelease: true
