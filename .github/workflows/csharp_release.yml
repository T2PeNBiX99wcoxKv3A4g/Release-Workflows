name: C# Release

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration (e.g. Release / Debug)'
      project_path:
        required: false
        type: string
        default: '.'
        description: 'Path to the .csproj (or a directory containing it). Must not be a .sln: --output is unsupported for solutions.'
      runtimes:
        required: false
        type: string
        default: '["win-x64", "linux-x64"]'
        description: 'JSON array of .NET Runtime Identifiers (RID) to publish for'
      setup_aot_toolchain:
        required: false
        type: boolean
        default: false
        description: 'Install the Native AOT build dependencies of the target OS before publishing. Only needed when the project sets PublishAot=true'
      filename:
        required: false
        type: string
        default: 'release'
        description: 'Output archive filename prefix'
      version_keyword:
        required: false
        type: string
        default: Version
        description: 'Keyword for version in project configuration'
      version_file_path:
        required: false
        type: string
        default: ./Directory.Build.props
        description: 'File path containing project version'
      update_readme:
        required: false
        type: boolean
        default: false
        description: 'Whether to update the version in README'
      readme_file_path:
        required: false
        type: string
        default: ./README.md
        description: 'README file path'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this release is a pre-release'

jobs:
  version-change:
    name: Version Change
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      update_readme: ${{ inputs.update_readme }}
      readme_file_path: ${{ inputs.readme_file_path }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: "action: Update version and update `CHANGELOG.md`"
    secrets: inherit

  build:
    name: Build
    needs: [ version-change ]
    uses: ./.github/workflows/csharp_build.yml
    with:
      dotnet_version: ${{ inputs.dotnet_version }}
      configuration: ${{ inputs.configuration }}
      project_path: ${{ inputs.project_path }}
      runtimes: ${{ inputs.runtimes }}
      setup_aot_toolchain: ${{ inputs.setup_aot_toolchain }}
      filename: ${{ inputs.filename }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, build ]
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs.version-change.outputs.new_tag }}
      changelog: ${{ needs.version-change.outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: "release/*"
    secrets: inherit
