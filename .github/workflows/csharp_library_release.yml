name: C# Library Release

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
        description: '.NET SDK version to set up'
      configuration:
        required: false
        type: string
        default: 'Release'
        description: 'Build configuration'
      project_path:
        required: true
        type: string
        description: 'Path to the .csproj (or the directory containing it)'
      version_file_path:
        required: true
        type: string
        description: 'File that holds the library version'
      version_keyword:
        required: false
        type: string
        default: Version
        description: 'Version key in the version file'
      extra_version_files:
        required: false
        type: string
        default: ''
        description: |
          Additional files kept in sync with sync-version, one per line.
          Append "|<version-key>" to restrict replacement to that key.
      publish_nuget:
        required: false
        type: boolean
        default: false
        description: 'Publish the .nupkg when NUGET_API_KEY is available'
      filename:
        required: false
        type: string
        default: 'library'
        description: 'Artifact name and release file prefix'
      artifacts_path:
        required: false
        type: string
        default: 'release'
        description: 'Directory where the packages are collected'
      update_readme:
        required: false
        type: boolean
        default: false
        description: 'Also sync the version inside the README'
      readme_file_path:
        required: false
        type: string
        default: './README.md'
        description: 'README file to update'
      prerelease:
        required: false
        type: boolean
        default: false
        description: 'Whether this is a pre-release'
      commit_message:
        required: false
        type: string
        default: 'action: Update version and update `CHANGELOG.md`'
        description: 'Commit message for the version bump'

jobs:
  version-change:
    name: Version Change
    uses: ./.github/workflows/version_change.yml
    with:
      version_file_path: ${{ inputs.version_file_path }}
      version_keyword: ${{ inputs.version_keyword }}
      extra_version_files: ${{ inputs.extra_version_files }}
      update_readme: ${{ inputs.update_readme }}
      readme_file_path: ${{ inputs.readme_file_path }}
      prerelease: ${{ inputs.prerelease }}
      commit_message: ${{ inputs.commit_message }}
    secrets: inherit

  build:
    name: Build .NET package
    needs: [ version-change ]
    uses: ./.github/workflows/csharp_library_build.yml
    with:
      version: ${{ needs['version-change'].outputs.new_version }}
      dotnet_version: ${{ inputs.dotnet_version }}
      configuration: ${{ inputs.configuration }}
      project_path: ${{ inputs.project_path }}
      publish_nuget: ${{ inputs.publish_nuget }}
      artifacts_path: ${{ inputs.artifacts_path }}
      filename: ${{ inputs.filename }}
    secrets: inherit

  upload:
    name: Create Release
    needs: [ version-change, build ]
    uses: ./.github/workflows/create_release.yml
    with:
      tag: ${{ needs['version-change'].outputs.new_tag }}
      changelog: ${{ needs['version-change'].outputs.changelog }}
      prerelease: ${{ inputs.prerelease }}
      artifacts: ${{ inputs.artifacts_path }}/*
      artifacts_path: ${{ inputs.artifacts_path }}
    secrets: inherit
